<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Blood Donation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-red: #B91C1C;
            --secondary-gray: #f8f9fa;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-red) 0%, #dc3545 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            margin: 20px;
        }
        
        .login-left {
            background: linear-gradient(135deg, var(--primary-red) 0%, #dc3545 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }
        
        .login-right {
            padding: 60px 40px;
        }
        
        .admin-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 30px;
        }
        
        .form-control:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 0.2rem rgba(185, 28, 28, 0.25);
        }
        
        .btn-primary {
            background-color: var(--primary-red);
            border-color: var(--primary-red);
            padding: 12px 30px;
            font-weight: 600;
        }
        
        .btn-primary:hover {
            background-color: #991b1b;
            border-color: #991b1b;
        }
        
        .feature-item {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .feature-item i {
            margin-right: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
            
            .login-right {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row g-0">
            <div class="col-md-5">
                <div class="login-left">
                    <div class="admin-avatar">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h2 class="mb-4">Admin Portal</h2>
                    <p class="mb-4">Comprehensive management system for blood donation services</p>
                    
                    <div class="feature-item">
                        <i class="fas fa-users"></i>
                        <span>User Management</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-bar"></i>
                        <span>System Analytics</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-cogs"></i>
                        <span>System Controls</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-shield-check"></i>
                        <span>Security Management</span>
                    </div>
                    
                    <div class="mt-5">
                        <small>Blood Donation System v1.0</small>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="login-right">
                    <div class="text-center mb-5">
                        <h3 style="color: var(--primary-red);">Admin Login</h3>
                        <p class="text-muted">Enter your credentials to access the admin dashboard</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">
                                    Remember me
                                </label>
                            </div>
                        </div>
                        
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i> Login to Dashboard
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <small class="text-muted">
                                Default credentials: admin / admin123
                            </small>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="http://localhost:5004" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <script>
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Simple authentication (in production, this should be server-side)
            if (username === 'admin' && password === 'admin123') {
                // Store authentication token
                const authToken = btoa(username + ':' + new Date().toISOString());
                
                if (remember) {
                    localStorage.setItem('adminToken', authToken);
                } else {
                    sessionStorage.setItem('adminToken', authToken);
                }
                
                alert('Login successful! Redirecting to admin dashboard...');
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Invalid username or password. Please try again.');
                
                // Clear password field
                document.getElementById('password').value = '';
                
                // Add error styling
                const passwordField = document.getElementById('password');
                passwordField.classList.add('is-invalid');
                setTimeout(() => {
                    passwordField.classList.remove('is-invalid');
                }, 3000);
            }
        });
        
        // Check if user is already logged in
        function checkAuth() {
            const token = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
            if (token) {
                // In production, validate token with server
                window.location.href = 'admin-dashboard.html';
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });
    </script>
</body>
</html>
