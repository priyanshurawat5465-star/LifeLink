<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Registration - Blood Donation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-red: #B91C1C;
            --secondary-gray: #f8f9fa;
        }
        
        body {
            background-color: var(--secondary-gray);
        }
        
        .navbar {
            background-color: var(--primary-red) !important;
        }
        
        .btn-primary {
            background-color: var(--primary-red);
            border-color: var(--primary-red);
        }
        
        .btn-primary:hover {
            background-color: #991b1b;
            border-color: #991b1b;
        }
        
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .form-control:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 0.2rem rgba(185, 28, 28, 0.25);
        }
        
        #map {
            height: 300px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .location-info {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .hospital-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white" href="http://localhost:5004">
                <i class="fas fa-hospital"></i> Blood Donation System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="http://localhost:5004">Home</a>
                <a class="nav-link text-white" href="http://localhost:5002/login">Login</a>
                <a class="nav-link text-white active" href="http://localhost:5002">Register</a>
                <a class="nav-link text-white" href="http://localhost:5002/dashboard">Dashboard</a>
                <a class="nav-link text-white" href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-white text-center">
                        <div class="hospital-avatar">
                            <i class="fas fa-hospital"></i>
                        </div>
                        <h3 class="mb-0" style="color: var(--primary-red);">
                            Hospital Registration
                        </h3>
                        <p class="text-muted">Register your hospital to access blood donation services</p>
                    </div>
                    <div class="card-body">
                        <form id="registrationForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Hospital Name *</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="license" class="form-label">License Number *</label>
                                    <input type="text" class="form-control" id="license" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Full Address *</label>
                                <textarea class="form-control" id="address" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Contact Phone *</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Password *</label>
                                    <input type="password" class="form-control" id="password" required minlength="6">
                                    <small class="text-muted">Minimum 6 characters</small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password *</label>
                                    <input type="password" class="form-control" id="confirmPassword" required minlength="6">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Initial Blood Inventory</label>
                                <div class="row">
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">A+</label>
                                        <input type="number" class="form-control" id="A+" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">A-</label>
                                        <input type="number" class="form-control" id="A-" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">B+</label>
                                        <input type="number" class="form-control" id="B+" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">B-</label>
                                        <input type="number" class="form-control" id="B-" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">AB+</label>
                                        <input type="number" class="form-control" id="AB+" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">AB-</label>
                                        <input type="number" class="form-control" id="AB-" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">O+</label>
                                        <input type="number" class="form-control" id="O+" min="0" value="0">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label class="form-label small">O-</label>
                                        <input type="number" class="form-control" id="O-" min="0" value="0">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Hospital Location</label>
                                <div class="location-info">
                                    <small class="text-muted">Your location will be used for emergency blood requests</small>
                                    <div id="locationDetails" class="mt-2">
                                        <strong>Coordinates:</strong> <span id="coordinates">Getting location...</span>
                                    </div>
                                </div>
                                <div id="map"></div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" required>
                                    <label class="form-check-label" for="terms">
                                        I agree to the terms and conditions and certify that all provided information is accurate
                                    </label>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-check-circle"></i> Register Hospital
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <script>
        let map;
        let marker;
        let userLocation = { lat: null, lng: null };

        // Initialize map
        function initMap() {
            map = L.map('map').setView([20.5937, 78.9629], 5); // Default to India center
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        // Get user location
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation.lat = position.coords.latitude;
                        userLocation.lng = position.coords.longitude;
                        
                        document.getElementById('coordinates').textContent = 
                            `${userLocation.lat.toFixed(6)}, ${userLocation.lng.toFixed(6)}`;
                        
                        // Update map view and add marker
                        map.setView([userLocation.lat, userLocation.lng], 15);
                        
                        if (marker) {
                            marker.setLatLng([userLocation.lat, userLocation.lng]);
                        } else {
                            marker = L.marker([userLocation.lat, userLocation.lng]).addTo(map);
                        }
                    },
                    (error) => {
                        console.error('Error getting location:', error);
                        document.getElementById('coordinates').textContent = 
                            'Unable to get location. Please enable location services.';
                    }
                );
            } else {
                document.getElementById('coordinates').textContent = 
                    'Geolocation is not supported by this browser.';
            }
        }

        // Handle form submission
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate passwords match
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match. Please try again.');
                document.getElementById('confirmPassword').value = '';
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }
            
            if (!userLocation.lat || !userLocation.lng) {
                alert('Please enable location services to register your hospital.');
                return;
            }

            // Get blood inventory values
            const bloodTypes = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
            const unitsAvailable = {};
            
            bloodTypes.forEach(type => {
                unitsAvailable[type] = parseInt(document.getElementById(type).value) || 0;
            });

            const formData = {
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                license: document.getElementById('license').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                password: password, // Add password to form data
                unitsAvailable: unitsAvailable,
                location: {
                    type: 'Point',
                    coordinates: [userLocation.lng, userLocation.lat] // MongoDB expects [longitude, latitude]
                },
                verified: false // Will be verified by admin
            };

            try {
                const response = await fetch('http://localhost:5002/api/hospitals/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('Registration successful! Your hospital will be verified by an admin shortly. Redirecting to dashboard...');
                    localStorage.setItem('hospitalId', result.hospital._id);
                    window.location.href = 'http://localhost:5002/dashboard';
                } else {
                    alert('Registration failed: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during registration. Please try again.');
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            getUserLocation();
        });
    </script>
</body>
</html>
